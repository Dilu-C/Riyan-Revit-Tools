title: "Type Mark Tag\nFinder"
tooltip: |
  Searches and selects elements in the active view by matching a specific Type Mark value.

  - Queries type parameters across all visible elements.
  - Highlights matching elements directly in Revit selection.

  How to use:
  1. Open an active model view.
  2. Click Type Mark Tag Finder and enter Type Mark value to search.
  3. Matching elements are selected in Revit.
