title: "Missing Rebar\nTag Finder"
tooltip: |
  Finds and selects untagged rebar elements in the current view.

  - Scans visible reinforcement and isolates bars missing tags.
  - Ready for immediate 'Tag All Not Tagged' annotation workflow.

  How to use:
  1. Open an active model view (not a sheet).
  2. Click Missing Rebar Tag Finder.
  3. Untagged rebars are selected in Revit so you can tag them immediately.
