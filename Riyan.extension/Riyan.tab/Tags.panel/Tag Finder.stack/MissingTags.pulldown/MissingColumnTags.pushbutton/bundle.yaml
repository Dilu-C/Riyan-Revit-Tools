title: "Missing Column\nTag Finder"
tooltip: |
  Finds and selects untagged structural columns in the current view.

  - Scans visible columns and isolates members missing tags.
  - Ready for immediate 'Tag All Not Tagged' annotation workflow.

  How to use:
  1. Open an active model view (not a sheet).
  2. Click Missing Column Tag Finder.
  3. Untagged columns are selected in Revit so you can tag them immediately.
