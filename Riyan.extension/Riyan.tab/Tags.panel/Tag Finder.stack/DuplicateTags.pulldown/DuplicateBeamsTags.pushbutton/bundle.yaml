title: "Duplicate Beam\nTag Finder"
tooltip: |
  Finds and selects structural framing beams in the current view that have duplicate tags attached.

  - Detects elements associated with multiple tags in active view.
  - Highlights duplicate instances in selection set for one-click removal.

  How to use:
  1. Open an active model view (not a sheet).
  2. Click Duplicate Beam Tag Finder.
  3. Beams with duplicate tags are selected in Revit for easy tag cleanup.
