title: "Duplicate Rebar\nTag Finder"
tooltip: |
  Finds and selects structural rebar elements in the current view that have duplicate tags attached.

  - Detects rebar instances associated with multiple tags in active view.
  - Highlights duplicate instances in selection set for one-click removal.

  How to use:
  1. Open an active model view (not a sheet).
  2. Click Duplicate Rebar Tag Finder.
  3. Rebars with duplicate tags are selected in Revit for easy tag cleanup.
