title: Brick Masonry
tooltip: |
  Parametrically generates individual brick and block courses on selected wall geometry.

  - Supports Standard Brick, Solid Concrete Block, Hollow Block, and Paving units.
  - Configures realistic mortar joint thickness and bond patterns.
  - Generates true individual unit counts for accurate quantity takeoffs.

  How to use:
  1. Select target wall in active model (or click tool to pick).
  2. Choose block type, dimensions, and mortar joint gap in dialog.
  3. Click Create to generate parametric masonry courses.
