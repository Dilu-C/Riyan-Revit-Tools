title: "Data"
tooltip: |
  Calculates and batch-injects 25 dynamic schedule parameters across door and window families in seconds.

  - Auto-detects Room To/From, Host Wall Type, Wall Thickness, Sill, and Lintel heights.
  - Replaces manual text typing with live model geometry links.
  - Keeps Door and Window schedule tables 100% synchronized with architectural revisions.

  How to use:
  1. Open the project model containing placed doors and windows.
  2. Ensure rooms are placed and elements are hosted in walls.
  3. Click Data - all 25 schedule parameters populate automatically across all instances.
