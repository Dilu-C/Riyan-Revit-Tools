title: Update Tables
tooltip: |
  Refreshes and synchronizes existing door/window schedule tables against latest 3D model geometry.

  - Updates room locations, instance counts, dimensions, and materials in generated drafting views.
  - Guarantees drawing documentation always matches current 3D geometry.

  How to use:
  1. Open the project model containing generated schedule drafting views.
  2. Click Update Tables.
  3. All generated schedule drafting views sync with latest 3D model data.
