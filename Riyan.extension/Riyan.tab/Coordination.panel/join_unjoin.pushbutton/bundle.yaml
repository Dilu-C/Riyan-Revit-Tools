title: "Join / Unjoin"
tooltip: |
  Batch joins or unjoins intersecting building elements across categories in a single pass.

  - Eliminates visual linework collisions between Walls, Columns, Beams, and Floors.
  - Supports batch joining between any two selected categories.
  - Fast cleanup before sheet publication and drawing export.

  How to use:
  1. Open active project model and click Join / Unjoin.
  2. Select Primary category and Secondary intersecting category.
  3. Choose 'Join' or 'Unjoin' to process all intersecting geometry.
