title: Get Coordinates
tooltip: |
  Extracts real-world coordinates and writes them into shared parameters for scheduling and site setting-out.

  - Calculates X, Y, Z coordinates for structural columns, foundations, and piles.
  - Supports Survey Point, Project Base Point, and Internal Origin systems.
  - Populates Coord_X, Coord_Y, and Coord_Z parameters automatically.

  How to use:
  1. Open project model and select target elements or categories.
  2. Click Get Coordinates to open coordinate mapping window.
  3. Choose coordinate reference system and click 'Write Coordinates'.
