title: Export Manager
tooltip: |
  Enterprise export and publishing platform for the active model with inline vector sheet previews and collision-free archiving.

  - Exports selected sheets to PDF and DWG with custom naming conventions.
  - Smart selective archiving moves only colliding files to 00 PREVIOUS folders.
  - Generates automated Word (.docx) and Excel (.xlsx) Document Transmittal packages.

  How to use:
  1. Open the active project model and click Export Manager from the Export panel.
  2. Select sheets to export and choose your Naming Profile.
  3. Choose PDF / DWG export options and click 'Export'.
