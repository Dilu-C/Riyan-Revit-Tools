title: Export Manager
tooltip: >-
  Exports active model sheets to PDF and DWG with custom naming.
  
  • Exports selected sheets to PDF (Separate or Combined) and DWG formats.
  • Generates automated Document Transmittal reports in both Excel (.xlsx) and Word (.docx).
  • Color / Greyscale / Black & White printing profiles.
  
  How to use:
  1. Click to open the Export Manager dashboard.
  2. Select the sheets to export from the active model.
  3. [CRITICAL] Choose your Naming Profile before proceeding.
  4. Choose PDF / DWG export options and click 'Export'.
author: Udarie & Chalana
