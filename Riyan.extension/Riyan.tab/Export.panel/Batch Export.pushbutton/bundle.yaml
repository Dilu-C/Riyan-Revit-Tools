title: Batch Export
tooltip: >-
  Multi-model background batch exporter for closed Revit projects.
  
  • Queues multiple unopened Revit models (.rvt) for automated export.
  • Sheetwise Profile: Automatically exports separate individual sheet PDFs.
  • Combined Profile: Automatically merges sheets into a single Combined PDF (CAD auto-disabled).
  • Generates execution status logs and automated transmittal lists.
  
  How to use:
  1. Click to open Batch Export queue window.
  2. Add Revit project files (.rvt) to the list.
  3. Select your Export Profile (Export Mode is automatically driven by profile).
  4. Click 'Run Batch Export'.
author: Chalana Perera
