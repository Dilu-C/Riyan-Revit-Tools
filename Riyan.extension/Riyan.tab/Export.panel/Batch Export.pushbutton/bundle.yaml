title: Batch Export
tooltip: |
  High-velocity background batch exporter that publishes CAD and PDF packages from multiple closed Revit models.

  - Processes multiple closed models in memory without graphical view overhead.
  - Automatic Sheetwise mode (separate PDFs) or Combined mode (single multi-page PDF).
  - Generates automated Excel drawing list transmittals and execution status logs.

  How to use:
  1. Click Batch Export to open the queue dashboard.
  2. Add project models (.rvt) and select your export profile (PDF / DWG).
  3. Click 'Run Batch Export' and let the engine export in the background.
