title: Load
tooltip: >-
  Visual family library browser for Riyan BIM Standards.
  
  • Browse architectural, structural, and MEP families with 3D thumbnails.
  • Search by keywords, categories, and parameters.
  • One-click direct loading into active Revit project.
  
  How to use:
  1. Click Riyan Library (Load).
  2. Filter by discipline (ARC, STR, PLU, FIRE, ACMV) or search.
  3. Select family and click 'Load into Project'.
author: Dilupa
