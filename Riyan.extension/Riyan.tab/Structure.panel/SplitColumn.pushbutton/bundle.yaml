title: Split Column
tooltip: |
  Splits multi-story structural columns into individual per-floor segments at selected levels.

  - Divides continuous columns at chosen intermediate building levels.
  - Maintains cross-section type, materials, and structural properties on split segments.
  - Corrects analytical framing models for multi-story buildings.

  How to use:
  1. Select continuous multi-story columns in active model.
  2. Click Split Column.
  3. Select target intermediate split levels and confirm.
