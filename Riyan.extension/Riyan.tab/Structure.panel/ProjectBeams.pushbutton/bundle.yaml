title: Project Beams
tooltip: |
  Projects 2D/3D model lines onto sloped or complex roof/floor slab surfaces to generate structural framing members.

  - Mathematically aligns centerline vectors to planar or sloped surface faces.
  - Automatically places framing beams with precise vertical offsets.
  - Preserves plan (X, Y) coordinates with zero lateral distortion.

  How to use:
  1. Open a 3D or plan view containing model lines and the target sloped surface.
  2. Click Project Beams.
  3. Pick the target roof or slab face, then select the model lines to convert into beams.
