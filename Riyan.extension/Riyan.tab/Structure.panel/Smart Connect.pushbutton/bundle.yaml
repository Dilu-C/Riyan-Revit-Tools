title: Smart Connect
tooltip: |
  Batch-places structural steel connections between primary members and all intersecting framing.

  - Detects intersecting beams, columns, and purlins automatically.
  - Batch-places standard structural connection families (base plates, apex, clip angles).
  - Eliminates manual connection-by-connection placement.

  How to use:
  1. Open structural 3D or section view.
  2. Click Smart Connect and pick the primary structural member.
  3. Choose desired connection type to apply across all intersecting members.
